[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[project]
name = "dumbpw"
version = "1.0.5"
description = "A bad password generator for bad websites with bad password policies"
authors = [{ name = "Ryan Delaney", email = "ryan.patrick.delaney+spammers.only@protonmail.com" }]
requires-python = ">=3.10"
readme = "README.rst"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0.3",
    "deal>=4.19.1",
]
repository = "https://github.com/rpdelaney/dumbpw"
homepage = "https://pypi.org/project/dumbpw"

[project.scripts]
dumbpw = "dumbpw.cli:cli"

[dependency-groups]
dev = [
    "deal-solver>=0.1.0",
    "hypothesis>=6.39.4",
    "pre-commit>=4.5.1",
    "ptpython>=3.0.23",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.15.1",
    "pytest>=6.2.5",
    "ruff",
    "ty>=0.0.72",
]

[tool.uv.build-backend]
module-name = "dumbpw"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["dumbpw", "tests"]
console_output_style = "progress"
addopts = [
    "--cov=dumbpw",
    "--doctest-modules",
    "--strict-config",
    "--strict-markers",
    "-rA",
]
filterwarnings = ["error"]
xfail_strict = true
